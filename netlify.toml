# The game is a static site: Netlify builds web/ and serves the generated files.
[build]
  base = "web"
  command = "npm run generate"
  # Relative to base. On Netlify, Nuxt picks its "netlify-static" preset and writes the
  # site to dist/ (locally it writes .output/public and links dist/ to it).
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Unknown paths fall back to the app shell so client-side routes still load.
[[redirects]]
  from = "/*"
  to = "/200.html"
  status = 200
